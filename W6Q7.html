<!doctype html>
<html>
  <head>
    <title>Greeting Script</title>
  </head>
  <body>
    <script>
      // Ask user for greeting
      let userChoice = confirm("Do you want to see a greeting message?");

      if (userChoice === true) {
        // Display GIF
        document.write('<img src="welcome-5.gif" alt="Welcome GIF"><br>');

        // Display message
        document.write("<h2>Welcome to Department of Computer Science!</h2>");
      }
    </script>
  </body>
</html>
