<!doctype html>
<html>
  <head>
    <title>Open Window</title>
    <script>
      function openNewWindow() {
        window.open("https://www.google.com", "_blank", "width=400,height=300");
      }
    </script>
  </head>
  <body>
    <h2>Open New Window</h2>

    <button onclick="openNewWindow()">Open Window</button>
  </body>
</html>
