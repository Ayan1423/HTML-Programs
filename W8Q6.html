<!doctype html>
<html>
  <head>
    <title>Digital Clock</title>
  </head>
  <body>
    <h1 id="clock"></h1>

    <script>
      function showTime() {
        let now = new Date();

        let h = now.getHours();
        let m = now.getMinutes();
        let s = now.getSeconds();

        // Add leading zero
        h = h < 10 ? "0" + h : h;
        m = m < 10 ? "0" + m : m;
        s = s < 10 ? "0" + s : s;

        let time = h + ":" + m + ":" + s;

        document.getElementById("clock").innerHTML = time;

        setTimeout(showTime, 1000); // update every second
      }

      showTime();
    </script>
  </body>
</html>
